[project]
name = "stormtracker"
version = "0.1.0"
description = "Self-hosted modular weather and storm tracker for Australia"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "numpy>=1.26",
  "pillow>=10",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "tzdata",
  # nowcasting: pySTEPS (optical flow + extrapolation) needs scipy, matplotlib and OpenCV. pySTEPS is sdist-only
  # and compiles two Cython extensions, so the Docker image builds wheels in a separate stage.
  "scipy>=1.11",
  "pysteps>=1.10",
  "opencv-python-headless>=4.8",
  "apprise>=1.9",                  # one alert destination that reaches 100+ services
  "asyncpg>=0.29",                 # so DATABASE_URL=postgresql+asyncpg://... works out of the box (SQLite is the default)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stormtracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
