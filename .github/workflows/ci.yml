name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # reused by the release workflow, so a tag can't ship without passing the tests

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (pySTEPS compiles from source, so this takes a few minutes)
        run: pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
