# Runs the published image. Put your settings in .env (copy .env.example). Pin a version, for example :0.1.0, if you
# don't want updates to arrive on "docker compose pull".
services:
  stormtracker:
    image: ghcr.io/bionicdonkey/weatherhomie:latest
    # To build from a checkout instead, comment out "image" and use:
    # build: .
    env_file: .env
    ports:
      - "${HTTP_PORT:-8000}:8000"      # use "127.0.0.1:8000:8000" to keep it off your network and put a proxy in front
    volumes:
      - stormtracker-data:/data
    restart: unless-stopped
volumes:
  stormtracker-data:
